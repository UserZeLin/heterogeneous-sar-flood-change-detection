<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">异构 SAR 洪水变化检测端到端流程</title>
  <desc id="desc">Sentinel-1 与 UAVSAR 输入经过预处理、跨模态转换、同模态差分、GMM 分类和形态学处理，输出变化概率图、二值图及叠加图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="sar" x1="0" x2="1">
      <stop offset="0" stop-color="#14213d"/>
      <stop offset="0.5" stop-color="#5c677d"/>
      <stop offset="1" stop-color="#1b263b"/>
    </linearGradient>
    <linearGradient id="change" x1="0" x2="1">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="1" stop-color="#ef476f"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#315b7d"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17324d" flood-opacity="0.15"/>
    </filter>
    <pattern id="speckle" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="url(#sar)"/>
      <circle cx="3" cy="5" r="1.5" fill="#d9e2ec" opacity="0.55"/>
      <circle cx="13" cy="12" r="2" fill="#a7b6c8" opacity="0.35"/>
      <circle cx="8" cy="16" r="1" fill="#ffffff" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="1440" height="560" rx="22" fill="url(#bg)"/>
  <text x="720" y="48" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="28" font-weight="700" fill="#17324d">从异构 SAR 影像到洪水变化产品</text>
  <text x="720" y="78" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="15" fill="#59748b">训练阶段学习跨模态映射；检测阶段将两个时期统一到同一模态后再比较</text>

  <g filter="url(#shadow)">
    <rect x="42" y="120" width="235" height="340" rx="18" fill="#ffffff" stroke="#b8c9d9"/>
    <text x="159" y="153" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="20" font-weight="700" fill="#17324d">输入影像</text>
    <rect x="70" y="174" width="179" height="88" rx="10" fill="url(#speckle)"/>
    <path d="M70 230 C105 205 133 248 172 215 S218 203 249 226 V262 H70Z" fill="#74c0fc" opacity="0.48"/>
    <text x="159" y="284" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="15" font-weight="600" fill="#315b7d">Sentinel-1（C 波段 VV/VH）</text>
    <rect x="70" y="309" width="179" height="88" rx="10" fill="url(#speckle)"/>
    <path d="M70 350 C107 378 137 329 171 357 S218 369 249 342 V397 H70Z" fill="#ffd166" opacity="0.42"/>
    <text x="159" y="419" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="15" font-weight="600" fill="#315b7d">UAVSAR（L 波段 HH）</text>
    <text x="159" y="443" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="13" fill="#71879a">2022 / 2024 对应区域</text>
  </g>

  <line x1="278" y1="290" x2="336" y2="290" stroke="#315b7d" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="342" y="167" width="210" height="246" rx="18" fill="#ffffff" stroke="#89b4d4"/>
    <circle cx="447" cy="216" r="34" fill="#e3f2fd" stroke="#58a6d6" stroke-width="2"/>
    <path d="M428 216h38M447 197v38" stroke="#3182b8" stroke-width="4" stroke-linecap="round"/>
    <text x="447" y="274" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="20" font-weight="700" fill="#17324d">统一预处理</text>
    <text x="447" y="307" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="14" fill="#47677f">标定 / dB 转换</text>
    <text x="447" y="332" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="14" fill="#47677f">重投影 / 配准</text>
    <text x="447" y="357" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="14" fill="#47677f">波段合并 / 归一化</text>
    <text x="447" y="382" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="14" fill="#47677f">空间无泄漏切片</text>
  </g>

  <line x1="553" y1="290" x2="611" y2="290" stroke="#315b7d" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="617" y="135" width="270" height="310" rx="18" fill="#17324d"/>
    <text x="752" y="174" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="20" font-weight="700" fill="#ffffff">跨模态生成器</text>
    <text x="752" y="200" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="13" fill="#b9d7ec">WGAN-GP + cycle consistency</text>
    <rect x="648" y="229" width="72" height="68" rx="9" fill="#3a86a8"/>
    <rect x="716" y="239" width="72" height="68" rx="9" fill="#4ca1c4"/>
    <rect x="784" y="249" width="72" height="68" rx="9" fill="#67b7d1"/>
    <text x="752" y="342" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="14" fill="#e6f4ff">三尺度编码 → 空洞卷积 → 三分支解码</text>
    <rect x="657" y="365" width="190" height="42" rx="21" fill="#ef476f"/>
    <text x="752" y="391" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="14" font-weight="700" fill="#ffffff">UAVSAR → Sentinel-1 样式</text>
  </g>

  <line x1="888" y1="290" x2="946" y2="290" stroke="#315b7d" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="952" y="167" width="205" height="246" rx="18" fill="#ffffff" stroke="#c5b4e3"/>
    <text x="1054" y="205" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="20" font-weight="700" fill="#17324d">同模态检测</text>
    <circle cx="1024" cy="260" r="35" fill="#dfe7fd"/>
    <circle cx="1084" cy="260" r="35" fill="#f3d9fa"/>
    <text x="1054" y="267" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#6a4c93">−</text>
    <text x="1054" y="328" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="14" fill="#47677f">变化幅值</text>
    <text x="1054" y="352" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="14" fill="#47677f">2-component GMM</text>
    <text x="1054" y="376" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="14" fill="#47677f">形态学过滤</text>
  </g>

  <line x1="1158" y1="290" x2="1216" y2="290" stroke="#315b7d" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="1222" y="120" width="176" height="340" rx="18" fill="#ffffff" stroke="#e6a1b3"/>
    <text x="1310" y="153" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="20" font-weight="700" fill="#17324d">输出产品</text>
    <rect x="1250" y="177" width="120" height="64" rx="8" fill="url(#change)"/>
    <text x="1310" y="263" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="14" fill="#47677f">变化概率图</text>
    <rect x="1250" y="284" width="120" height="64" rx="8" fill="#102a43"/>
    <path d="M1262 334 L1281 303 L1300 319 L1320 296 L1358 327 V348 H1262Z" fill="#ffffff"/>
    <text x="1310" y="370" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="14" fill="#47677f">变化二值图</text>
    <rect x="1250" y="391" width="120" height="42" rx="8" fill="#516a82"/>
    <path d="M1264 420 C1290 385 1324 431 1358 399" fill="none" stroke="#ff4d6d" stroke-width="9" opacity="0.88"/>
    <text x="1310" y="451" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="12" fill="#71879a">GeoTIFF + 地理参考</text>
  </g>

  <text x="720" y="520" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="13" fill="#71879a">结构示意图；色块不代表真实遥感观测值或论文定量结果</text>
</svg>
