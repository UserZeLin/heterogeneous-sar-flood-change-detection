<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">论文生成器网络结构</title>
  <desc id="desc">输入在原始、二分之一和四分之一尺度编码，经并行空洞残差块融合，进入三条解码分支，再通过空间注意力融合得到输出。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="1" stop-color="#eef4fa"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#355b78"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#17324d" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1500" height="720" rx="22" fill="url(#bg)"/>
  <text x="750" y="46" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="28" font-weight="700" fill="#17324d">MultiScaleGenerator：多尺度、多空洞、多分支与空间注意力</text>
  <text x="750" y="76" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="14" fill="#607d94">所有分支最终恢复到输入空间尺寸；训练时 A→B 与 B→A 各使用一套同结构生成器</text>

  <g filter="url(#shadow)">
    <rect x="38" y="292" width="150" height="138" rx="16" fill="#17324d"/>
    <text x="113" y="327" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#ffffff">输入切片</text>
    <text x="113" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#b9d7ec">3 × H × W</text>
    <rect x="67" y="375" width="92" height="30" rx="6" fill="#4ca1c4"/>
    <text x="113" y="396" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">[-1, 1]</text>
  </g>

  <line x1="188" y1="361" x2="238" y2="361" stroke="#355b78" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="244" y="128" width="260" height="464" rx="18" fill="#ffffff" stroke="#8dbbd8"/>
    <text x="374" y="164" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="20" font-weight="700" fill="#17324d">三尺度并行编码</text>
    <text x="374" y="189" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="13" fill="#607d94">共享结构，不共享特征张量</text>

    <rect x="278" y="225" width="192" height="78" rx="12" fill="#dff3ff" stroke="#4ca1c4"/>
    <text x="374" y="255" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="16" font-weight="700" fill="#24516d">原始尺度</text>
    <text x="374" y="281" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#47677f">H × W → H × W</text>

    <rect x="278" y="325" width="192" height="78" rx="12" fill="#cdeeff" stroke="#3498c8"/>
    <text x="374" y="355" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="16" font-weight="700" fill="#24516d">1/2 尺度</text>
    <text x="374" y="381" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#47677f">H/2 × W/2 → H/2 × W/2</text>

    <rect x="278" y="425" width="192" height="78" rx="12" fill="#b9e4f7" stroke="#247ba0"/>
    <text x="374" y="455" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="16" font-weight="700" fill="#24516d">1/4 尺度</text>
    <text x="374" y="481" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#47677f">H/4 × W/4 → H/4 × W/4</text>

    <text x="374" y="548" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="13" fill="#607d94">Conv + InstanceNorm + ReLU</text>
    <text x="374" y="571" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="13" fill="#607d94">池化到 1/4 尺度后逐元素相加</text>
  </g>

  <line x1="504" y1="361" x2="554" y2="361" stroke="#355b78" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="560" y="174" width="250" height="374" rx="18" fill="#ffffff" stroke="#d4a5e6"/>
    <text x="685" y="211" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="20" font-weight="700" fill="#17324d">上下文特征融合</text>
    <rect x="596" y="251" width="178" height="57" rx="10" fill="#eee2f7"/>
    <text x="685" y="286" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="15" fill="#6a4c93">多尺度特征对齐 + Add</text>

    <line x1="685" y1="309" x2="685" y2="337" stroke="#75558f" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="583" y="343" width="204" height="107" rx="12" fill="#6a4c93"/>
    <text x="685" y="374" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="16" font-weight="700" fill="#ffffff">残差特征提取</text>
    <text x="685" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#f4eaff">dilation branches = 1 / 2 / 4</text>
    <text x="685" y="430" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="13" fill="#e6d7f1">标准块与多空洞块交替配置</text>

    <line x1="685" y1="451" x2="685" y2="478" stroke="#75558f" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="620" y="484" width="130" height="36" rx="18" fill="#d9c2e9"/>
    <text x="685" y="507" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="13" fill="#543b6a">融合特征 H/4 × W/4</text>
  </g>

  <line x1="810" y1="361" x2="860" y2="361" stroke="#355b78" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="866" y="128" width="270" height="464" rx="18" fill="#ffffff" stroke="#f2ba72"/>
    <text x="1001" y="164" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="20" font-weight="700" fill="#17324d">三分支并行解码</text>

    <path d="M912 246 H1090 L1076 300 H926Z" fill="#ffd6a5" stroke="#e89b45"/>
    <text x="1001" y="278" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="15" font-weight="700" fill="#70451c">分支 1：深层输出头</text>
    <text x="1001" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7a604a">2× ConvTranspose + y1 skip</text>

    <path d="M926 347 H1076 L1064 400 H938Z" fill="#ffbf69" stroke="#dd8325"/>
    <text x="1001" y="379" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="15" font-weight="700" fill="#70451c">分支 2：中尺度输出头</text>
    <text x="1001" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7a604a">y2 skip + ConvTranspose + resize</text>

    <path d="M912 447 H1090 L1078 500 H924Z" fill="#f4a261" stroke="#d8732e"/>
    <text x="1001" y="479" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="15" font-weight="700" fill="#ffffff">分支 3：轻量输出头</text>
    <text x="1001" y="522" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7a604a">2× ConvTranspose + y1 skip</text>

    <text x="1001" y="558" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="13" fill="#607d94">ConvTranspose + skip features</text>
  </g>

  <line x1="1136" y1="361" x2="1186" y2="361" stroke="#355b78" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="1192" y="216" width="175" height="290" rx="18" fill="#ffffff" stroke="#e994aa"/>
    <text x="1279" y="253" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="19" font-weight="700" fill="#17324d">空间注意力</text>
    <circle cx="1279" cy="326" r="48" fill="#ffd9e2" stroke="#ef476f" stroke-width="2"/>
    <path d="M1249 326 Q1279 294 1309 326 Q1279 358 1249 326Z" fill="#ef476f"/>
    <circle cx="1279" cy="326" r="10" fill="#ffffff"/>
    <text x="1279" y="404" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="14" fill="#47677f">三分支平均</text>
    <text x="1279" y="430" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="14" fill="#47677f">单通道空间增强 + Tanh</text>
    <text x="1279" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#8a5262">attention ∈ [0, 1]</text>
  </g>

  <line x1="1367" y1="361" x2="1401" y2="361" stroke="#355b78" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="1407" y="300" width="70" height="122" rx="14" fill="#ef476f"/>
    <text x="1442" y="338" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="15" font-weight="700" fill="#ffffff">输出</text>
    <text x="1442" y="369" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffe9ef">3×H×W</text>
    <text x="1442" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffe9ef">[-1,1]</text>
  </g>

  <path d="M310 611 H1090" fill="none" stroke="#93a9ba" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="700" y="643" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="14" fill="#607d94">判别器：带 spectral normalization 的 PatchGAN；对局部影像块输出真实性评分</text>
  <text x="750" y="686" text-anchor="middle" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="13" fill="#71879a">网络结构示意；具体通道数与残差块数量由 configs/train.yaml 控制</text>
</svg>
